[package]
name = "psyche-core"
version.workspace = true
edition = "2021"

[dependencies]
anyhow.workspace = true
anchor-lang.workspace = true
anchor-lang-idl.workspace = true
bytemuck.workspace = true
fast-math.workspace = true
rand = { workspace = true, optional = true }
serde.workspace = true
postcard.workspace = true
fnv = "1.0.7"
serde_arrays = "0.1.0"
bitvec = { git = "https://github.com/arilotter/bitvec", rev = "d33a2437f810ee4229457dfd1137d807914671f8", features = [
  "serde",
  "std",
] }
ts-rs.workspace = true
data-encoding = "2.8.0"

[target.'cfg(not(target_os = "solana"))'.dependencies]
sha2.workspace = true

[features]
rand = ["dep:rand"]

[dev-dependencies]
approx = "0.5.1"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"

[[bench]]
name = "merkle_bench"
harness = false

[[bench]]
name = "blocking_io_bench"
harness = false

[[bench]]
name = "similarity_bench"
harness = false

[dev-dependencies.rand]
workspace = true

[[bench]]
name = "fixed_vec_bench"
harness = false
